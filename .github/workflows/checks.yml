name: Linux checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:44
            packages: dnf -y install python3 git ShellCheck gawk
          - image: ubuntu:24.04
            packages: apt-get update && apt-get install -y python3 git shellcheck
          - image: debian:13
            packages: apt-get update && apt-get install -y python3 git shellcheck
          - image: archlinux:base
            packages: pacman -Syu --noconfirm python git shellcheck
          - image: opensuse/tumbleweed:latest
            packages: zypper --non-interactive install python3 git ShellCheck
    container: ${{ matrix.image }}
    steps:
      - name: Install check dependencies
        run: ${{ matrix.packages }}
      - uses: actions/checkout@v6
      - name: Shell syntax and static checks
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          scripts=(**/*.sh)
          (( ${#scripts[@]} > 0 ))
          for script in "${scripts[@]}"; do
            echo "Checking $script"
            bash -n "$script"
            shellcheck -x "$script"
          done
      - name: Hardware-free regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Installation preview
        run: bash install.sh --dry-run
